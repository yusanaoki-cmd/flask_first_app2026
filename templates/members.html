<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <ul>
        それぞれのメンバーを表示
        <li>{{members[0] }}</li>
        <li>{{members[1] }}</li>
        <li>{{members[2] }}</li>
    </ul>
    <ul>
        for文を使って表示
        {% for member in members %}
        <li>{{ member }}</li>
        {% endfor %}
    </ul>
</body>

</html>
